name: HierarchyDeltaEnvelopeV1
kind: message
surfaces: [unity, debugstudio]
fields:
  - { id: 0, name: SchemaVersion, type: i32, default: 1 }
  - { id: 1, name: BaseRevision, type: i64 }
  - { id: 2, name: Revision, type: i64 }
  - { id: 3, name: CapturedAtUnixTimeMilliseconds, type: i64 }
  - { id: 4, name: ScopeName, type: string, default: "" }
  - { id: 5, name: Changes, type: array<HierarchyNodeChangeDtoV1>, default: [] }
encodings:
  messagepack:
    key_field: id
